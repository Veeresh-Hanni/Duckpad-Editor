name: Build DuckPad Editor

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            executable: DuckPad_Editor.exe
            archive: DuckPad_Editor-windows.zip
          - os: macos-latest
            platform: macos
            archive: DuckPad_Editor-macos.dmg
          - os: ubuntu-latest
            platform: linux
            archive: DuckPad_Editor-linux.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Smoke test icon loading
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; from PyQt5.QtWidgets import QApplication; from duckpad import DuckPad; app = QApplication([]); editor = DuckPad(); assert editor.windowIcon().isNull() == sys.platform.startswith('linux'), 'Unexpected DuckPad window icon state'; editor.close(); app.quit()"

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ("${env:GITHUB_REF_TYPE}" -eq "tag" -and "${env:GITHUB_REF_NAME}" -match '^v\d+\.\d+\.\d+$') {
            $packageVersion = "${env:GITHUB_REF_NAME}".Substring(1)
          } else {
            $packageVersion = "0.0.0.${env:GITHUB_RUN_NUMBER}"
          }
          pyinstaller --noconsole --onefile --add-data "duckpad.png;." --name DuckPad_Editor duckpad.py
          if (!(Test-Path "dist\DuckPad_Editor.exe")) { throw "Windows executable was not created" }
          @"
          #define MyAppVersion "$packageVersion"
          [Setup]
          AppId={{B7C50D42-1F0E-4D08-9A37-9E6EF9A6D6A0}
          AppName=DuckPad Editor
          AppVersion={#MyAppVersion}
          AppPublisher=Veeresh Hanni
          DefaultDirName={autopf}\DuckPad Editor
          DefaultGroupName=DuckPad Editor
          OutputDir=.
          OutputBaseFilename=DuckPad_Editor_Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\DuckPad_Editor.exe
          
          [Files]
          Source: "dist\DuckPad_Editor.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "duckpad.png"; DestDir: "{app}"; Flags: ignoreversion
          
          [Icons]
          Name: "{autoprograms}\DuckPad Editor"; Filename: "{app}\DuckPad_Editor.exe"
          Name: "{autodesktop}\DuckPad Editor"; Filename: "{app}\DuckPad_Editor.exe"; Tasks: desktopicon
          
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          "@ | Set-Content -Path windows-installer.iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc windows-installer.iss
          if (!(Test-Path "DuckPad_Editor_Setup.exe")) { throw "Windows installer was not created" }
          Compress-Archive -Path dist\DuckPad_Editor.exe -DestinationPath $env:GITHUB_WORKSPACE\${{ matrix.archive }}
          if (!(Test-Path "${{ matrix.archive }}")) { throw "Windows release archive was not created" }

      - name: Build macOS executable
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconsole --windowed --add-data "duckpad.png:." --name DuckPad_Editor duckpad.py
          test -f "dist/DuckPad_Editor.app/Contents/MacOS/DuckPad_Editor"
          test -f "dist/DuckPad_Editor.app/Contents/Resources/duckpad.png"
          mkdir -p dmg-root
          cp -R "dist/DuckPad_Editor.app" "dmg-root/"
          hdiutil create -volname "DuckPad Editor" -srcfolder dmg-root -ov -format UDZO "${{ matrix.archive }}"
          test -f "${{ matrix.archive }}"
          tar -czf "DuckPad_Editor-macos.tar.gz" -C dist "DuckPad_Editor.app"

      - name: Build Linux executable
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential \
            libgl1 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxkbcommon0 libxkbcommon-x11-0
          sudo gem install --no-document fpm
          python -c "from PIL import Image; img = Image.open('duckpad.png'); img.thumbnail((256, 256)); img.save('duckpad-build.png')"
          pyinstaller --noconsole --onefile --icon=duckpad-build.png --add-data "duckpad.png:." --name DuckPad_Editor duckpad.py
          mkdir -p package-root/usr/local/bin package-root/usr/share/icons/duckpad package-root/usr/share/applications
          install -m 0755 dist/DuckPad_Editor package-root/usr/local/bin/duckpad
          install -m 0644 duckpad.png package-root/usr/share/icons/duckpad/icon.png
          cat > package-root/usr/share/applications/duckpad.desktop <<'EOF'
          [Desktop Entry]
          Name=DuckPad Editor
          Comment=Cross-platform text editor
          Exec=/usr/local/bin/duckpad
          Icon=/usr/share/icons/duckpad/icon.png
          Terminal=false
          Type=Application
          Categories=Development;TextEditor;
          EOF
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          else
            PACKAGE_VERSION="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          rm -f duckpad-editor_*.deb duckpad-editor-*.rpm
          fpm -s dir -t deb -n duckpad-editor -v "${PACKAGE_VERSION}" -a amd64 \
            --depends libgl1 --depends libx11-xcb1 --depends libxcb1 \
            --depends libxcb-cursor0 --depends libxcb-image0 \
            --depends libxcb-keysyms1 --depends libxcb-randr0 \
            --depends libxcb-render0 --depends libxcb-shape0 \
            --depends libxcb-xinerama0 --depends libxcb-xfixes0 \
            --depends libxkbcommon0 --depends libxkbcommon-x11-0 \
            --description "DuckPad Editor desktop text editor" -C package-root .
          fpm -s dir -t rpm -n duckpad-editor -v "${PACKAGE_VERSION}" -a x86_64 \
            --depends mesa-libGL --depends libX11-xcb --depends libxcb \
            --depends libxcb-cursor --depends libxcb-image \
            --depends xcb-util-keysyms --depends libxcb-randr \
            --depends libxcb-render-util --depends libxcb-shape \
            --depends libxcb-xinerama --depends libxcb-xfixes \
            --depends libxkbcommon --depends libxkbcommon-x11 \
            --description "DuckPad Editor desktop text editor" -C package-root .
          test -x "dist/DuckPad_Editor"
          set +e
          timeout 10s env QT_QPA_PLATFORM=offscreen QT_X11_NO_MITSHM=1 dist/DuckPad_Editor
          STARTUP_STATUS=$?
          set -e
          if [[ "${STARTUP_STATUS}" -ne 124 ]]; then
            echo "Packaged Linux app exited unexpectedly with status ${STARTUP_STATUS}"
            exit "${STARTUP_STATUS}"
          fi
          test -f "duckpad-editor_${PACKAGE_VERSION}_amd64.deb"
          test -f "duckpad-editor-${PACKAGE_VERSION}-1.x86_64.rpm"
          tar -czf "${{ matrix.archive }}" -C dist DuckPad_Editor
          rm -f duckpad-build.png

      - name: Upload Windows build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: DuckPad_Editor-windows
          path: |
            DuckPad_Editor_Setup.exe
            DuckPad_Editor-windows.zip
          if-no-files-found: error

      - name: Upload macOS builds
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: DuckPad_Editor-macos
          path: |
            DuckPad_Editor-macos.dmg
            DuckPad_Editor-macos.tar.gz
          if-no-files-found: error

      - name: Upload Linux builds
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: DuckPad_Editor-linux
          path: |
            DuckPad_Editor-linux.tar.gz
            duckpad-editor_*.deb
            duckpad-editor-*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: DuckPad_Editor-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
