name: Build DuckPad Editor

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            executable: DuckPad_Editor.exe
            archive: DuckPad_Editor-windows.zip
          - os: macos-latest
            platform: macos
            archive: DuckPad_Editor-macos.dmg
          - os: ubuntu-latest
            platform: linux
            archive: DuckPad_Editor-linux.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name DuckPad_Editor duckpad.py
          Compress-Archive -Path dist\DuckPad_Editor.exe -DestinationPath $env:GITHUB_WORKSPACE\${{ matrix.archive }}

      - name: Build macOS executable
        if: matrix.platform == 'macos'
        run: |
          pyinstaller --noconsole --windowed --name DuckPad_Editor duckpad.py
          mkdir -p dmg-root
          cp -R "dist/DuckPad_Editor.app" "dmg-root/"
          hdiutil create -volname "DuckPad Editor" -srcfolder dmg-root -ov -format UDZO "${{ matrix.archive }}"
          tar -czf "DuckPad_Editor-macos.tar.gz" -C dist "DuckPad_Editor.app"

      - name: Build Linux executable
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          pyinstaller --noconsole --onefile --name DuckPad_Editor duckpad.py
          mkdir -p package-root/usr/local/bin package-root/usr/share/icons/duckpad package-root/usr/share/applications
          install -m 0755 dist/DuckPad_Editor package-root/usr/local/bin/duckpad
          install -m 0644 duckpad.png package-root/usr/share/icons/duckpad/icon.png
          cat > package-root/usr/share/applications/duckpad.desktop <<'EOF'
          [Desktop Entry]
          Name=DuckPad Editor
          Comment=Cross-platform text editor
          Exec=/usr/local/bin/duckpad
          Icon=/usr/share/icons/duckpad/icon.png
          Terminal=false
          Type=Application
          Categories=Development;TextEditor;
          EOF
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          else
            PACKAGE_VERSION="1.0.0"
          fi
          fpm -s dir -t deb -n duckpad-editor -v "${PACKAGE_VERSION}" -a amd64 \
            --description "DuckPad Editor desktop text editor" -C package-root .
          fpm -s dir -t rpm -n duckpad-editor -v "${PACKAGE_VERSION}" -a x86_64 \
            --description "DuckPad Editor desktop text editor" -C package-root .
          tar -czf "${{ matrix.archive }}" -C dist DuckPad_Editor

      - name: Upload Windows build
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: DuckPad_Editor-windows
          path: DuckPad_Editor-windows.zip
          if-no-files-found: error

      - name: Upload macOS builds
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: DuckPad_Editor-macos
          path: |
            DuckPad_Editor-macos.dmg
            DuckPad_Editor-macos.tar.gz
          if-no-files-found: error

      - name: Upload Linux builds
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: DuckPad_Editor-linux
          path: |
            DuckPad_Editor-linux.tar.gz
            duckpad-editor_*.deb
            duckpad-editor-*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: DuckPad_Editor-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
